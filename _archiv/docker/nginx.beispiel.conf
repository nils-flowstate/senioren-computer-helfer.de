# Beispiel für Nginx als Reverse Proxy (GEO-LLM.txt §11).
#
# Die Zertifikate stammen aus Certbot:
#   sudo certbot certonly --nginx -d senioren-computer-helfer.de -d www.senioren-computer-helfer.de
#
# Kopieren nach /etc/nginx/sites-available/senioren-computer-helfer.conf,
# verknüpfen nach sites-enabled, dann:
#   sudo nginx -t && sudo systemctl reload nginx

# Port 80 dient nur der Weiterleitung auf HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name senioren-computer-helfer.de www.senioren-computer-helfer.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://senioren-computer-helfer.de$request_uri;
    }
}

# Die www-Variante wird dauerhaft auf die kanonische Adresse umgeleitet.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.senioren-computer-helfer.de;

    ssl_certificate     /etc/letsencrypt/live/senioren-computer-helfer.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senioren-computer-helfer.de/privkey.pem;

    return 301 https://senioren-computer-helfer.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name senioren-computer-helfer.de;

    ssl_certificate     /etc/letsencrypt/live/senioren-computer-helfer.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senioren-computer-helfer.de/privkey.pem;

    # Fotos aus heutigen Handys sind groß. Der Wert passt zu MAX_UPLOAD_MB in
    # der .env und sollte mit ihr zusammen geändert werden.
    client_max_body_size 12m;

    # Bewusst KEINE Sicherheitskopfzeilen an dieser Stelle. Sie werden
    # ausschließlich in src/middleware.ts gesetzt. Zwei Setzorte überschreiben
    # einander still und man sucht den Fehler an der falschen Stelle.

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Diese Zeile ist nicht optional. An ihr erkennt die Anwendung, dass die
        # Verbindung verschlüsselt ist. Fehlt sie, hält sich die Anwendung für
        # unverschlüsselt erreichbar, setzt "Secure" nicht auf das Sitzungs-
        # Cookie und sendet keine HSTS-Kopfzeile — ohne jede Fehlermeldung.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Die KI braucht für eine durchdachte Antwort ein paar Sekunden.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Antworten des Chats werden nicht zwischengespeichert (§10).
        proxy_buffering off;
    }
}
